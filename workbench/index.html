<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>副总工作台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            padding: 12px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .date {
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }
        .status {
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 12px;
            background: #e6f7e6;
            color: #52c41a;
        }
        .card {
            background: white;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        .card-title {
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }
        .count {
            font-size: 11px;
            color: #999;
            background: #f5f5f5;
            padding: 2px 6px;
            border-radius: 10px;
        }
        .task-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .task-item {
            display: flex;
            align-items: center;
            padding: 8px;
            background: #f8f9fa;
            border-radius: 6px;
            font-size: 13px;
        }
        .task-checkbox {
            width: 16px;
            height: 16px;
            border: 2px solid #ddd;
            border-radius: 3px;
            margin-right: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
        }
        .task-checkbox.done {
            background: #52c41a;
            border-color: #52c41a;
            color: white;
        }
        .task-name.done {
            text-decoration: line-through;
            color: #999;
        }
        .task-meta {
            font-size: 11px;
            color: #999;
            margin-left: auto;
        }
        .skill-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }
        .skill-item {
            text-align: center;
            padding: 8px 4px;
            background: #f8f9fa;
            border-radius: 6px;
            font-size: 11px;
        }
        .skill-icon {
            font-size: 20px;
            margin-bottom: 2px;
        }
        .skill-name {
            color: #666;
        }
        .api-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .api-item {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            padding: 6px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .api-item:last-child {
            border-bottom: none;
        }
        .api-status {
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .api-status.ready {
            background: #e6f7e6;
            color: #52c41a;
        }
        .api-status.pending {
            background: #fff7e6;
            color: #faad14;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="date" id="currentDate">4月7日 周一</div>
        <div class="status">运行中</div>
    </div>

    <div class="card">
        <div class="card-title">
            <span>🔄 每日例行工作</span>
            <span class="count">2次/天</span>
        </div>
        <div class="task-list">
            <div class="task-item">
                <div class="task-checkbox" id="routine-am"></div>
                <span class="task-name">📰 公众号文章发布</span>
                <span class="task-meta">11:00</span>
            </div>
            <div class="task-item">
                <div class="task-checkbox" id="routine-pm"></div>
                <span class="task-name">📰 公众号文章发布</span>
                <span class="task-meta">18:00</span>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-title">
            <span>📋 今日任务</span>
            <span class="count" id="taskCount">3项</span>
        </div>
        <div class="task-list" id="todayTasks">
            <div class="task-item">
                <div class="task-checkbox done">✓</div>
                <span class="task-name done">装备所有新技能到技能库</span>
                <span class="task-meta">已完成</span>
            </div>
            <div class="task-item">
                <div class="task-checkbox"></div>
                <span class="task-name">开发飞书工作台小组件</span>
                <span class="task-meta">进行中</span>
            </div>
            <div class="task-item">
                <div class="task-checkbox"></div>
                <span class="task-name">测试小红书MCP发布功能</span>
                <span class="task-meta">待开始</span>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-title">
            <span>📅 明日计划</span>
            <span class="count">3项</span>
        </div>
        <div class="task-list">
            <div class="task-item">
                <div class="task-checkbox"></div>
                <span class="task-name">申请可灵AI API Key</span>
                <span class="task-meta">高优先级</span>
            </div>
            <div class="task-item">
                <div class="task-checkbox"></div>
                <span class="task-name">批量发布测试视频到多平台</span>
                <span class="task-meta">高优先级</span>
            </div>
            <div class="task-item">
                <div class="task-checkbox"></div>
                <span class="task-name">准备直播脚本模板</span>
                <span class="task-meta">中优先级</span>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-title">
            <span>🛠️ 技能库</span>
            <span class="count">11/12 就绪</span>
        </div>
        <div class="skill-grid">
            <div class="skill-item">
                <div class="skill-icon">🎬</div>
                <div class="skill-name">视频生成</div>
            </div>
            <div class="skill-item">
                <div class="skill-icon">✂️</div>
                <div class="skill-name">短视频</div>
            </div>
            <div class="skill-item">
                <div class="skill-icon">🔍</div>
                <div class="skill-name">视频抓取</div>
            </div>
            <div class="skill-item">
                <div class="skill-icon">🚀</div>
                <div class="skill-name">多平台发布</div>
            </div>
            <div class="skill-item">
                <div class="skill-icon">📕</div>
                <div class="skill-name">小红书</div>
            </div>
            <div class="skill-item">
                <div class="skill-icon">📰</div>
                <div class="skill-name">公众号</div>
            </div>
            <div class="skill-item">
                <div class="skill-icon">📝</div>
                <div class="skill-name">脚本规划</div>
            </div>
            <div class="skill-item">
                <div class="skill-icon">🎙️</div>
                <div class="skill-name">直播助手</div>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-title">
            <span>🔑 API配置</span>
        </div>
        <div class="api-list">
            <div class="api-item">
                <span>Tavily搜索</span>
                <span class="api-status ready">已配置</span>
            </div>
            <div class="api-item">
                <span>可灵AI</span>
                <span class="api-status pending">待配置</span>
            </div>
            <div class="api-item">
                <span>即梦</span>
                <span class="api-status pending">待配置</span>
            </div>
        </div>
    </div>

    <script>
        // 更新日期
        const now = new Date();
        const weekdays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
        document.getElementById('currentDate').textContent = 
            `${now.getMonth() + 1}月${now.getDate()}日 ${weekdays[now.getDay()]}`;
        
        // 更新每日例行工作完成状态
        const hour = now.getHours();
        const amCheckbox = document.getElementById('routine-am');
        const pmCheckbox = document.getElementById('routine-pm');
        
        if (hour >= 11) {
            amCheckbox.classList.add('done');
            amCheckbox.textContent = '✓';
        }
        if (hour >= 18) {
            pmCheckbox.classList.add('done');
            pmCheckbox.textContent = '✓';
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>副总工作台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            padding: 12px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .date {
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }
        .status {
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 12px;
            background: #e6f7e6;
            color: #52c41a;
        }
        .card {
            background: white;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        .card-title {
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }
        .count {
            font-size: 11px;
            color: #999;
            background: #f5f5f5;
            padding: 2px 6px;
            border-radius: 10px;
        }
        .task-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .task-item {
            display: flex;
            align-items: center;
            padding: 8px;
            background: #f8f9fa;
            border-radius: 6px;
            font-size: 13px;
        }
        .task-checkbox {
            width: 16px;
            height: 16px;
            border: 2px solid #ddd;
            border-radius: 3px;
            margin-right: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
        }
        .task-checkbox.done {
            background: #52c41a;
            border-color: #52c41a;
            color: white;
        }
        .task-name.done {
            text-decoration: line-through;
            color: #999;
        }
        .task-meta {
            font-size: 11px;
            color: #999;
            margin-left: auto;
        }
        .skill-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }
        .skill-item {
            text-align: center;
            padding: 8px 4px;
            background: #f8f9fa;
            border-radius: 6px;
            font-size: 11px;
        }
        .skill-icon {
            font-size: 20px;
            margin-bottom: 2px;
        }
        .skill-name {
            color: #666;
        }
        .api-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .api-item {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            padding: 6px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .api-item:last-child {
            border-bottom: none;
        }
        .api-status {
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .api-status.ready {
            background: #e6f7e6;
            color: #52c41a;
        }
        .api-status.pending {
            background: #fff7e6;
            color: #faad14;
        }
        .loading {
            text-align: center;
            color: #999;
            font-size: 12px;
            padding: 20px;
        }
        .error {
            text-align: center;
            color: #ff4d4f;
            font-size: 12px;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <div id="greeting" style="font-size: 12px; color: #666; margin-bottom: 2px;">加载中...</div>
            <div class="date" id="currentDate">加载中...</div>
        </div>
        <div class="status">运行中</div>
    </div>

    <div id="content">
        <div class="loading">正在加载数据...</div>
    </div>

    <script>
        // 从 data.json 加载数据
        async function loadData() {
            try {
                // 添加时间戳防止缓存
                const response = await fetch(`data.json?t=${Date.now()}`);
                if (!response.ok) {
                    throw new Error('加载数据失败');
                }
                const data = await response.json();
                renderPage(data);
            } catch (error) {
                console.error('加载数据失败:', error);
                document.getElementById('content').innerHTML = 
                    '<div class="error">数据加载失败，请刷新重试</div>';
            }
        }

        // 渲染页面
        function renderPage(data) {
            const now = new Date();
            const currentHour = now.getHours();
            
            // 更新问候语
            const hour = now.getHours();
            let greeting = '早上好';
            if (hour >= 11 && hour < 13) {
                greeting = '中午好';
            } else if (hour >= 13 && hour < 18) {
                greeting = '下午好';
            } else if (hour >= 18) {
                greeting = '晚上好';
            }
            document.getElementById('greeting').textContent = `${greeting}，老板`;
            
            // 更新日期
            document.getElementById('currentDate').textContent = 
                `${data.date.replace(/-/g, '月').replace(/月/, '月').replace(/2026年/, '').replace(/-/, '日')} ${data.weekday}`;
            
            // 渲染每日例行工作
            const routineHtml = data.routine.map((item, index) => {
                const isDone = item.done || (index === 0 && currentHour >= 11) || (index === 1 && currentHour >= 18);
                return `
                    <div class="task-item">
                        <div class="task-checkbox ${isDone ? 'done' : ''}">${isDone ? '✓' : ''}</div>
                        <span class="task-name">${item.name}</span>
                        <span class="task-meta">${item.time}</span>
                    </div>
                `;
            }).join('');

            // 渲染今日任务
            const todayTasksHtml = data.todayTasks.map(task => `
                <div class="task-item">
                    <div class="task-checkbox ${task.status === 'done' ? 'done' : ''}">${task.status === 'done' ? '✓' : ''}</div>
                    <span class="task-name ${task.status === 'done' ? 'done' : ''}">${task.name}</span>
                    <span class="task-meta">${task.meta}</span>
                </div>
            `).join('');

            // 渲染明日计划
            const tomorrowTasksHtml = data.tomorrowTasks.map(task => `
                <div class="task-item">
                    <div class="task-checkbox"></div>
                    <span class="task-name">${task.name}</span>
                    <span class="task-meta">${task.priority}优先级</span>
                </div>
            `).join('');

            // 渲染技能库
            const skillsHtml = data.skills.list.map(skill => `
                <div class="skill-item">
                    <div class="skill-icon">${skill.icon}</div>
                    <div class="skill-name">${skill.name}</div>
                </div>
            `).join('');

            // 渲染API配置
            const apisHtml = data.apis.map(api => `
                <div class="api-item">
                    <span>${api.name}</span>
                    <span class="api-status ${api.status}">${api.status === 'ready' ? '已配置' : '待配置'}</span>
                </div>
            `).join('');

            // 组合所有内容
            document.getElementById('content').innerHTML = `
                <div class="card">
                    <div class="card-title">
                        <span>🔄 每日例行工作</span>
                        <span class="count">${data.routine.length}次/天</span>
                    </div>
                    <div class="task-list">
                        ${routineHtml}
                    </div>
                </div>

                <div class="card">
                    <div class="card-title">
                        <span>📋 今日任务</span>
                        <span class="count">${data.todayTasks.length}项</span>
                    </div>
                    <div class="task-list">
                        ${todayTasksHtml}
                    </div>
                </div>

                <div class="card">
                    <div class="card-title">
                        <span>📅 明日计划</span>
                        <span class="count">${data.tomorrowTasks.length}项</span>
                    </div>
                    <div class="task-list">
                        ${tomorrowTasksHtml}
                    </div>
                </div>

                <div class="card">
                    <div class="card-title">
                        <span>🛠️ 技能库</span>
                        <span class="count">${data.skills.ready}/${data.skills.total} 就绪</span>
                    </div>
                    <div class="skill-grid">
                        ${skillsHtml}
                    </div>
                </div>

                <div class="card">
                    <div class="card-title">
                        <span>🔑 API配置</span>
                    </div>
                    <div class="api-list">
                        ${apisHtml}
                    </div>
                </div>
            `;
        }

        // 页面加载时执行
        loadData();
        
        // 每30秒自动刷新数据
        setInterval(loadData, 30000);
        
        // 每分钟检查一次是否需要更新日期（跨天时）
        setInterval(() => {
            const now = new Date();
            if (now.getHours() === 0 && now.getMinutes() === 0) {
                loadData();
            }
        }, 60000);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>副总工作台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        .header {
            margin-bottom: 24px;
        }
        .greeting {
            font-size: 14px;
            color: rgba(255,255,255,0.6);
            margin-bottom: 4px;
        }
        .title {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #fff 0%, rgba(255,255,255,0.7) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .date {
            font-size: 13px;
            color: rgba(255,255,255,0.5);
            margin-top: 4px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-bottom: 20px;
        }
        .card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }
        .card:hover {
            background: rgba(255,255,255,0.08);
        }
        .card-icon {
            font-size: 32px;
            margin-bottom: 12px;
        }
        .card-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .card-desc {
            font-size: 12px;
            color: rgba(255,255,255,0.5);
        }
        .badge {
            position: absolute;
            top: 16px;
            right: 16px;
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.8);
        }
        .section {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
        }
        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .task-item {
            display: flex;
            align-items: center;
            padding: 12px;
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            margin-bottom: 8px;
        }
        .task-checkbox {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            margin-right: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            flex-shrink: 0;
        }
        .task-checkbox.done {
            background: #10b981;
            border-color: #10b981;
        }
        .task-name {
            flex: 1;
            font-size: 14px;
        }
        .task-name.done {
            text-decoration: line-through;
            color: rgba(255,255,255,0.5);
        }
        .task-meta {
            font-size: 12px;
            color: rgba(255,255,255,0.5);
        }
        .loading, .error {
            text-align: center;
            padding: 40px;
            color: rgba(255,255,255,0.5);
        }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="header">
        <div class="greeting" id="greeting">加载中...</div>
        <div class="title">工作台</div>
        <div class="date" id="currentDate">加载中...</div>
    </div>

    <div id="content">
        <div class="loading">正在加载数据...</div>
    </div>

    <script>
        // 加载数据
        async function loadData() {
            try {
                const response = await fetch(`data.json?t=${Date.now()}`);
                if (!response.ok) throw new Error('加载失败');
                const data = await response.json();
                render(data);
            } catch (error) {
                document.getElementById('content').innerHTML = 
                    '<div class="error">数据加载失败，请刷新重试</div>';
            }
        }

        // 渲染页面
        function render(data) {
            const now = new Date();
            const hour = now.getHours();
            
            // 问候语
            let greeting = '早上好';
            if (hour >= 11 && hour < 13) greeting = '中午好';
            else if (hour >= 13 && hour < 18) greeting = '下午好';
            else if (hour >= 18) greeting = '晚上好';
            document.getElementById('greeting').textContent = `${greeting}，老板`;
            
            // 日期
            document.getElementById('currentDate').textContent = 
                `${data.date} ${data.weekday}`;
            
            // 计算任务数量
            const todayTotal = data.todayTasks.length;
            const todayDone = data.todayTasks.filter(t => t.status === 'done').length;
            const tomorrowTotal = data.tomorrowTasks.length;
            
            // 渲染内容
            document.getElementById('content').innerHTML = `
                <div class="grid">
                    <div class="card" onclick="showDetail('today')">
                        <div class="badge">${todayDone}/${todayTotal}</div>
                        <div class="card-icon">📋</div>
                        <div class="card-title">今日任务</div>
                        <div class="card-desc">已完成 ${todayDone} 项</div>
                    </div>
                    <div class="card" onclick="showDetail('tomorrow')">
                        <div class="badge">${tomorrowTotal}</div>
                        <div class="card-icon">📅</div>
                        <div class="card-title">明日计划</div>
                        <div class="card-desc">提前规划安排</div>
                    </div>
                    <div class="card">
                        <div class="badge">${data.skills.ready}/${data.skills.total}</div>
                        <div class="card-icon">🛠️</div>
                        <div class="card-title">技能库</div>
                        <div class="card-desc">已装备技能</div>
                    </div>
                    <div class="card">
                        <div class="badge">${data.apis.filter(a => a.status === 'ready').length}</div>
                        <div class="card-icon">🔑</div>
                        <div class="card-title">API配置</div>
                        <div class="card-desc">Key管理</div>
                    </div>
                </div>
                
                <div class="section">
                    <div class="section-title">
                        <span>🔄 每日例行工作</span>
                        <span style="font-size: 12px; color: rgba(255,255,255,0.5);">${data.routine.length}次/天</span>
                    </div>
                    ${data.routine.map(item => {
                        const isDone = item.done || (item.time === '11:00' && hour >= 11) || (item.time === '18:00' && hour >= 18);
                        return `
                            <div class="task-item">
                                <div class="task-checkbox ${isDone ? 'done' : ''}">${isDone ? '✓' : ''}</div>
                                <div class="task-name ${isDone ? 'done' : ''}">${item.name}</div>
                                <div class="task-meta">${item.time}</div>
                            </div>
                        `;
                    }).join('')}
                </div>
                
                <div class="section" id="todaySection">
                    <div class="section-title">
                        <span>📋 今日任务</span>
                        <span style="font-size: 12px; color: rgba(255,255,255,0.5);">${todayTotal}项</span>
                    </div>
                    ${data.todayTasks.map(task => `
                        <div class="task-item">
                            <div class="task-checkbox ${task.status === 'done' ? 'done' : ''}">${task.status === 'done' ? '✓' : ''}</div>
                            <div class="task-name ${task.status === 'done' ? 'done' : ''}">${task.name}</div>
                            <div class="task-meta">${task.meta}</div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        // 初始化
        loadData();
        setInterval(loadData, 30000); // 30秒刷新
    </script>
</body>
</html>

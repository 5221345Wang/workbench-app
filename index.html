<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#3370ff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>副总工作台</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 16px;
            padding-bottom: 80px;
        }
        
        /* 顶部状态栏 */
        .header {
            background: rgba(255,255,255,0.95);
            border-radius: 16px;
            padding: 16px 20px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
        }
        
        .header-left {
            display: flex;
            flex-direction: column;
        }
        
        .date {
            font-size: 24px;
            font-weight: 700;
            color: #1a1a2e;
        }
        
        .weekday {
            font-size: 14px;
            color: #666;
            margin-top: 2px;
        }
        
        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            background: #e6f7e6;
            border-radius: 20px;
            font-size: 13px;
            color: #52c41a;
            font-weight: 500;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            background: #52c41a;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        /* 卡片样式 */
        .card {
            background: rgba(255,255,255,0.95);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
        }
        
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        
        .card-title {
            font-size: 16px;
            font-weight: 600;
            color: #1a1a2e;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .card-count {
            font-size: 12px;
            color: #666;
            background: #f0f0f0;
            padding: 4px 10px;
            border-radius: 12px;
        }
        
        /* 任务列表 */
        .task-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .task-item {
            display: flex;
            align-items: center;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 12px;
            transition: all 0.2s;
        }
        
        .task-item:active {
            transform: scale(0.98);
            background: #e8e8e8;
        }
        
        .task-checkbox {
            width: 22px;
            height: 22px;
            border: 2px solid #ddd;
            border-radius: 6px;
            margin-right: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: white;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        
        .task-checkbox.done {
            background: #52c41a;
            border-color: #52c41a;
        }
        
        .task-content {
            flex: 1;
            min-width: 0;
        }
        
        .task-name {
            font-size: 14px;
            color: #1a1a2e;
            font-weight: 500;
            display: block;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .task-name.done {
            text-decoration: line-through;
            color: #999;
        }
        
        .task-meta {
            font-size: 11px;
            color: #999;
            margin-top: 2px;
        }
        
        .task-tag {
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 6px;
            margin-left: 8px;
            flex-shrink: 0;
        }
        
        .task-tag.high { background: #ffe6e6; color: #ff4d4f; }
        .task-tag.medium { background: #fff7e6; color: #fa8c16; }
        .task-tag.low { background: #e6f7ff; color: #1890ff; }
        
        /* 技能网格 */
        .skill-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        
        .skill-item {
            text-align: center;
            padding: 12px 4px;
            background: #f8f9fa;
            border-radius: 12px;
            transition: all 0.2s;
        }
        
        .skill-item:active {
            transform: scale(0.95);
            background: #e8e8e8;
        }
        
        .skill-icon {
            font-size: 28px;
            margin-bottom: 4px;
        }
        
        .skill-name {
            font-size: 11px;
            color: #666;
        }
        
        /* API 列表 */
        .api-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .api-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .api-item:last-child {
            border-bottom: none;
        }
        
        .api-name {
            font-size: 14px;
            color: #1a1a2e;
        }
        
        .api-status {
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 10px;
            font-weight: 500;
        }
        
        .api-status.ready {
            background: #e6f7e6;
            color: #52c41a;
        }
        
        .api-status.pending {
            background: #fff7e6;
            color: #fa8c16;
        }
        
        /* 底部导航 */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
            border-top: 1px solid rgba(0,0,0,0.05);
        }
        
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 4px 16px;
            color: #999;
            font-size: 11px;
            transition: all 0.2s;
        }
        
        .nav-item.active {
            color: #3370ff;
        }
        
        .nav-icon {
            font-size: 22px;
            margin-bottom: 2px;
        }
        
        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 24px;
            color: #999;
            font-size: 13px;
        }
        
        /* 刷新按钮 */
        .refresh-btn {
            position: fixed;
            bottom: 80px;
            right: 16px;
            width: 50px;
            height: 50px;
            background: #3370ff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            box-shadow: 0 4px 12px rgba(51,112,255,0.4);
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .refresh-btn:active {
            transform: scale(0.95);
        }
        
        .refresh-btn.spinning {
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        /* 安装提示 */
        .install-prompt {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: #3370ff;
            color: white;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            transform: translateY(-100%);
            transition: transform 0.3s;
        }
        
        .install-prompt.show {
            transform: translateY(0);
        }
        
        .install-btn {
            background: white;
            color: #3370ff;
            border: none;
            padding: 6px 14px;
            border-radius: 16px;
            font-size: 13px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <!-- 安装提示 -->
    <div class="install-prompt" id="installPrompt">
        <span>添加到主屏幕，像APP一样使用</span>
        <button class="install-btn" onclick="installPWA()">安装</button>
    </div>

    <!-- 顶部状态 -->
    <div class="header">
        <div class="header-left">
            <div class="date" id="currentDate">4月7日</div>
            <div class="weekday" id="currentWeekday">周一</div>
        </div>
        <div class="status-badge">
            <div class="status-dot"></div>
            <span>运行中</span>
        </div>
    </div>

    <!-- 今日任务 -->
    <div class="card">
        <div class="card-header">
            <div class="card-title">📋 今日任务</div>
            <div class="card-count" id="todayCount">3项</div>
        </div>
        <div class="task-list" id="todayTasks">
            <!-- 动态生成 -->
        </div>
    </div>

    <!-- 明日计划 -->
    <div class="card">
        <div class="card-header">
            <div class="card-title">📅 明日计划</div>
            <div class="card-count" id="tomorrowCount">3项</div>
        </div>
        <div class="task-list" id="tomorrowTasks">
            <!-- 动态生成 -->
        </div>
    </div>

    <!-- 技能库 -->
    <div class="card">
        <div class="card-header">
            <div class="card-title">🛠️ 技能库</div>
            <div class="card-count" id="skillCount">11/12 就绪</div>
        </div>
        <div class="skill-grid" id="skillGrid">
            <!-- 动态生成 -->
        </div>
    </div>

    <!-- API配置 -->
    <div class="card">
        <div class="card-header">
            <div class="card-title">🔑 API配置</div>
        </div>
        <div class="api-list" id="apiList">
            <!-- 动态生成 -->
        </div>
    </div>

    <!-- 刷新按钮 -->
    <button class="refresh-btn" id="refreshBtn" onclick="refreshData()">🔄</button>

    <!-- 底部导航 -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('work')">
            <div class="nav-icon">📊</div>
            <span>工作台</span>
        </div>
        <div class="nav-item" onclick="switchTab('tasks')">
            <div class="nav-icon">📝</div>
            <span>任务</span>
        </div>
        <div class="nav-item" onclick="switchTab('skills')">
            <div class="nav-icon">🛠️</div>
            <span>技能</span>
        </div>
        <div class="nav-item" onclick="switchTab('settings')">
            <div class="nav-icon">⚙️</div>
            <span>设置</span>
        </div>
    </div>

    <script>
        // 数据
        const appData = {
            todayTasks: [
                { id: 1, name: '装备所有新技能到技能库', status: 'done', priority: 'high', eta: '已完成' },
                { id: 2, name: '开发飞书工作台小组件', status: 'doing', priority: 'high', eta: '进行中' },
                { id: 3, name: '测试小红书MCP发布功能', status: 'todo', priority: 'medium', eta: '待开始' }
            ],
            tomorrowTasks: [
                { id: 4, name: '申请可灵AI API Key', status: 'todo', priority: 'high', eta: '高优先级' },
                { id: 5, name: '批量发布测试视频到多平台', status: 'todo', priority: 'high', eta: '高优先级' },
                { id: 6, name: '准备直播脚本模板', status: 'todo', priority: 'medium', eta: '中优先级' }
            ],
            skills: [
                { icon: '🎬', name: '视频生成', status: 'pending' },
                { icon: '✂️', name: '短视频', status: 'ready' },
                { icon: '🔍', name: '视频抓取', status: 'ready' },
                { icon: '🚀', name: '多平台', status: 'ready' },
                { icon: '📕', name: '小红书', status: 'ready' },
                { icon: '📰', name: '公众号', status: 'ready' },
                { icon: '📝', name: '脚本', status: 'ready' },
                { icon: '🎙️', name: '直播', status: 'ready' }
            ],
            apis: [
                { name: 'Tavily搜索', status: 'ready' },
                { name: '可灵AI', status: 'pending' },
                { name: '即梦', status: 'pending' }
            ]
        };

        // 初始化
        function init() {
            updateDate();
            renderTodayTasks();
            renderTomorrowTasks();
            renderSkills();
            renderAPIs();
            checkInstallPrompt();
        }

        // 更新日期
        function updateDate() {
            const now = new Date();
            const weekdays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
            document.getElementById('currentDate').textContent = `${now.getMonth() + 1}月${now.getDate()}日`;
            document.getElementById('currentWeekday').textContent = weekdays[now.getDay()];
        }

        // 渲染今日任务
        function renderTodayTasks() {
            const container = document.getElementById('todayTasks');
            document.getElementById('todayCount').textContent = `${appData.todayTasks.length}项`;
            
            container.innerHTML = appData.todayTasks.map(task => `
                <div class="task-item" onclick="toggleTask(${task.id})">
                    <div class="task-checkbox ${task.status === 'done' ? 'done' : ''}">
                        ${task.status === 'done' ? '✓' : ''}
                    </div>
                    <div class="task-content">
                        <span class="task-name ${task.status === 'done' ? 'done' : ''}">${task.name}</span>
                        <span class="task-meta">${task.eta}</span>
                    </div>
                    <span class="task-tag ${task.priority}">${getPriorityText(task.priority)}</span>
                </div>
            `).join('');
        }

        // 渲染明日任务
        function renderTomorrowTasks() {
            const container = document.getElementById('tomorrowTasks');
            document.getElementById('tomorrowCount').textContent = `${appData.tomorrowTasks.length}项`;
            
            container.innerHTML = appData.tomorrowTasks.map(task => `
                <div class="task-item">
                    <div class="task-checkbox"></div>
                    <div class="task-content">
                        <span class="task-name">${task.name}</span>
                        <span class="task-meta">${task.eta}</span>
                    </div>
                    <span class="task-tag ${task.priority}">${getPriorityText(task.priority)}</span>
                </div>
            `).join('');
        }

        // 渲染技能
        function renderSkills() {
            const container = document.getElementById('skillGrid');
            const readyCount = appData.skills.filter(s => s.status === 'ready').length;
            document.getElementById('skillCount').textContent = `${readyCount}/${appData.skills.length} 就绪`;
            
            container.innerHTML = appData.skills.map(skill => `
                <div class="skill-item">
                    <div class="skill-icon">${skill.icon}</div>
                    <div class="skill-name">${skill.name}</div>
                </div>
            `).join('');
        }

        // 渲染API
        function renderAPIs() {
            const container = document.getElementById('apiList');
            container.innerHTML = appData.apis.map(api => `
                <div class="api-item">
                    <span class="api-name">${api.name}</span>
                    <span class="api-status ${api.status}">${api.status === 'ready' ? '已配置' : '待配置'}</span>
                </div>
            `).join('');
        }

        // 获取优先级文字
        function getPriorityText(priority) {
            const map = { high: '高', medium: '中', low: '低' };
            return map[priority] || priority;
        }

        // 切换任务状态
        function toggleTask(id) {
            const task = appData.todayTasks.find(t => t.id === id);
            if (task) {
                task.status = task.status === 'done' ? 'todo' : 'done';
                renderTodayTasks();
                // 这里应该同步到服务器
            }
        }

        // 刷新数据
        function refreshData() {
            const btn = document.getElementById('refreshBtn');
            btn.classList.add('spinning');
            
            // 模拟刷新
            setTimeout(() => {
                btn.classList.remove('spinning');
                // 这里应该从服务器获取最新数据
                alert('已刷新');
            }, 1000);
        }

        // 切换标签
        function switchTab(tab) {
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
            });
            event.currentTarget.classList.add('active');
        }

        // 检查安装提示
        function checkInstallPrompt() {
            // 检测是否已安装
            if (window.matchMedia('(display-mode: standalone)').matches) {
                return; // 已安装
            }
            
            // 显示安装提示
            setTimeout(() => {
                document.getElementById('installPrompt').classList.add('show');
            }, 2000);
        }

        // 安装PWA
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
        });

        function installPWA() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        document.getElementById('installPrompt').classList.remove('show');
                    }
                    deferredPrompt = null;
                });
            } else {
                alert('iOS用户：点击分享按钮 → 添加到主屏幕\nAndroid用户：点击菜单 → 添加到主屏幕');
            }
        }

        // 启动
        init();
    </script>
</body>
</html>
